[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"

# Windows-only: auto-grant the WebView2 microphone permission so getUserMedia in
# the webview (S2S/C2S voice input, ADR-005) works without a flaky native prompt
# (phase v4-6 S-4 fix). Pinned to Tauri 2.11's transitive set — no version churn.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
